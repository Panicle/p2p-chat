<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>直连聊天 · P2P</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">

  <!-- 入口 -->
  <section id="landing" class="screen landing">
    <div class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9h13l-3-3"/><path d="M20 15H7l3 3"/>
          </svg>
        </div>
        <h1>直连聊天</h1>
        <p class="sub">点对点 · 端到端加密 · 内容不经过服务器</p>
      </div>

      <button id="btn-create" class="btn primary">创建会话</button>

      <div class="divider"><span>或加入已有会话</span></div>

      <form id="join-form" class="join-row" autocomplete="off">
        <input id="code-input" maxlength="6" placeholder="6 位会话码" spellcheck="false"
               inputmode="text" autocapitalize="characters">
        <button class="btn" type="submit">加入</button>
      </form>

      <p class="hint">
        会话码由对方提供。连接建立后，文字与文件在两台设备之间直接传输，
        服务器只负责交换连接信息，不保存任何聊天内容。
      </p>
    </div>
    <p class="foot">WebRTC DataChannel · 无需安装</p>
  </section>

  <!-- 聊天 -->
  <section id="chat" class="screen chat hidden">
    <header class="topbar">
      <div class="room">
        <span class="dot idle" id="status-dot"></span>
        <div class="room-meta">
          <div class="room-code" id="room-code">------</div>
          <div class="status-text" id="status-text">等待对方加入</div>
        </div>
      </div>
      <div class="actions">
        <button id="btn-copy" class="icon-btn" title="复制邀请链接" aria-label="复制邀请链接">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/>
            <path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>
          </svg>
        </button>
        <button id="btn-leave" class="icon-btn" title="离开会话" aria-label="离开会话">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="empty" id="empty-state">
        <p class="empty-title">会话已创建</p>
        <p class="empty-sub">把会话码 <b id="empty-code">------</b> 发给对方，或点击右上角复制邀请链接</p>
      </div>
    </main>

    <footer class="composer">
      <label class="icon-btn file-btn" title="发送文件或图片">
        <input type="file" id="file-input" multiple hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/>
        </svg>
      </label>
      <textarea id="msg-input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="btn-send" class="send-btn" title="发送">发送</button>
    </footer>

    <div id="drop-hint" class="drop-hint hidden">松开以发送文件</div>
  </section>

</div>
<script src="assets/peerjs.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
