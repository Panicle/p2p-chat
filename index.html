<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>直连聊天 · P2P</title>
<link rel="stylesheet" href="assets/style.css?v=14">
</head>
<body>
<div id="app">

  <!-- 入口 -->
  <section id="landing" class="screen landing">
    <div class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9h13l-3-3"/><path d="M20 15H7l3 3"/>
          </svg>
        </div>
        <h1>直连聊天</h1>
        <p class="sub">点对点 · 端到端加密 · 内容不经过服务器</p>
      </div>

      <form id="entry-form" class="entry" autocomplete="off">
        <input id="pass-input" type="text" placeholder="输入密码即可进入" maxlength="24"
               spellcheck="false" autocapitalize="characters" autocomplete="off">
        <p class="pass-error hidden" id="pass-error">密码错误，请重新输入</p>
      </form>

      <div class="avatars">
        <span class="avatar-tag"><span class="avatar" data-avatar="0"></span>先进入</span>
        <span class="avatar-tag"><span class="avatar" data-avatar="1"></span>后进入</span>
      </div>

      <p class="hint">
        双方输入同一个密码即可自动连接，无需选择创建或加入。
        先输入的一方成为发起方，后输入的一方自动接入。
        文字与文件在两台设备之间直接传输，服务器只交换连接信息，不保存任何聊天内容。
      </p>

      <p class="selfcheck">
        <button id="btn-diag" class="link-btn" type="button">连不上？点这里做网络自检</button>
      </p>
    </div>
    <p class="foot">WebRTC DataChannel · 无需安装</p>
  </section>

  <!-- 聊天 -->
  <section id="chat" class="screen chat hidden">
    <header class="topbar" id="topbar">
      <div class="room">
        <span class="dot idle" id="status-dot"></span>
        <div class="room-meta">
          <div class="room-title">私密会话</div>
          <div class="status-text" id="status-text">等待对方加入</div>
        </div>
      </div>
      <div class="actions">
        <button id="btn-call" class="icon-btn" title="语音通话" aria-label="语音通话">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>
        <span class="avatar avatar-top" id="peer-avatar" title="对方头像"></span>
        <button id="btn-leave" class="icon-btn" title="离开会话" aria-label="离开会话">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="call-bar" class="call-bar hidden">
      <span class="call-dot"></span>
      <span class="call-text">语音通话中</span>
      <span class="call-time">00:00</span>
      <button id="btn-hangup" class="hangup-btn" type="button">挂断</button>
    </div>

    <main id="messages" class="messages">
      <div class="empty" id="empty-state">
        <p class="empty-title">会话已创建</p>
        <p class="empty-sub">等待对方点击「加入会话」</p>
      </div>
    </main>

    <footer class="composer">
      <button id="btn-voice" class="icon-btn file-btn" title="按住录音" aria-label="录音">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <label class="icon-btn file-btn" title="发送文件或图片">
        <input type="file" id="file-input" multiple hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/>
        </svg>
      </label>
      <textarea id="msg-input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="btn-send" class="send-btn" title="发送">发送</button>
    </footer>

    <div id="drop-hint" class="drop-hint hidden">松开以发送文件</div>
  </section>

  <!-- 网络自检 -->
  <div id="diag-panel" class="diag hidden">
    <div class="diag-card">
      <div class="diag-head">
        <span>网络自检</span>
        <button id="diag-close" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div id="diag-body" class="diag-body">正在检测…</div>
    </div>
  </div>

</div>
<script src="assets/peerjs.min.js?v=14"></script>
<script src="assets/app.js?v=14"></script>
</body>
</html>
